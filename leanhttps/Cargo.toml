[package]
name = "leanhttps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Een compositie: leanhttp over leantls, en niets anders."

[dependencies]
leanhttp = { path = "../leanhttp" }
leantls = { path = "../leantls" }

[dev-dependencies]
leantls = { path = "../leantls", features = ["mozilla-roots"] }

[features]
# `leantls::MOZILLA_ROOTS` voor een gewone webclient (WebDial).
mozilla-roots = ["leantls/mozilla-roots"]

[lints]
workspace = true
